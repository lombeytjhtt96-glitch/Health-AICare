[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
variables = { PYTHONUNBUFFERED = "1", PYTHONDONTWRITEBYTECODE = "1" }
